    <!-- SHARED NAVBAR -->
   <div id="navbar-mount"></div>    

    <script>
        document.addEventListener("click", function(event) {
            const navbar = document.getElementById("header-placeholder");

            if (!navbar || !navbar.contains(event.target)) return;

            const clickedElement = event.target.closest(
                ".zatam-logo, [data-nav-page='contest'], #navbar-login-btn"
            );

            if (!clickedElement) return;

            let destination = null;

            if (clickedElement.matches(".zatam-logo") ||
                clickedElement.matches("[data-nav-page='contest']")) {
                destination = "https://zat.am/bp26/index.html";
            }

            else if (clickedElement.matches("#navbar-login-btn")) {
                const isLocal =
                    window.location.hostname === "localhost" ||
                    window.location.hostname === "127.0.0.1";

                const loginUrl = new URL(
                    "/auth/login.html",
                    "https://zat.am"
                );

                if (!isLocal) {
                    loginUrl.searchParams.set(
                        "redirect",
                        window.location.href
                    );
                }

                destination = loginUrl.href;
            }

            if (destination) {
                event.preventDefault();
                event.stopImmediatePropagation();
                window.location.assign(destination);
            }
        }, true); 
    </script>

        <script type="module" src="/js/navbar-loader.js"></script>   
 
    <!-- HOUSIE GAME HTML -->
    <div class="container" id="gameContainer">

        <div class="nav-top">
            <h2>Housie Number Generator</h2>
        </div>

        <div class="line-seperator"></div>

        <div class="san-generator" id="sanskritContainer">
            <h2 id="sanskritWord"></h2>
            <button class="san-tts" id="soundBtn" type="button">
                    🔈
                </button>
            </div>

        <div>
            <div class="btn-container">
                <button class="btnGenerate"
                        id="generateBtn" type="button">
                    Generate 🎲
                </button>

                <button class="btnReset"
                        id="resetBtn" type="button">
                    Reset ⟲
                </button>
            </div>

            <div class="numberTable" id="numberTable"></div>
        </div>

        <div class="popup" id="completePopup" hidden>
            <button class="completeXBtn"
                    id="closeComplete" type="button">
                X
            </button>

            <h2>⭐ All Numbers Filled ⭐</h2>
            <p>Click Reset to try again</p>
        </div>

        <div class="audioFiles" id="audioFiles"></div>

    </div>

    <!-- VANILLA JAVASCRIPT -->
    <script>
    (() => {
        "use strict";

        const grid = {
            rows: 10,
            columns: 3
        };

        const displayNumbers = [
            ...Array.from({ length: 20 }, (_, i) => i + 1),
            30, 40, 50, 60, 70, 80, 90, 100
        ];

        const sanskritWords = [
               "एकम् (ekam)", "द्वे (dve)", "त्रीणि (triiNi)", "चत्वारि (chatvaari)", "पञ्च (pa~ncha)",
            "षट् (ShaT)", "सप्त (sapta)", "अष्ट (aShTa)", "नव (nava)", "दश (dasha)",
    "एकादश (ekaadasha)", "द्वादश (dvaadasha)", "त्रयोदश (trayodasha)", "चतुर्दश (chaturdasha)", "पञ्चदश (pa~nchadasha)",
    "षोडश (ShoDasha)", "सप्तदश (saptadasha)", "अष्टादश (aShTaadasha)", "नवदश (navadasha)", "विंशतिः (viMshatiH)",
    "त्रिंशत् (triMshat)", "चत्वारिंशत् (chatvaariMshat)", "पञ्चाशत् (pa~nchaashat)", "षष्टिः (ShaShTiH)",
    "सप्ततिः (saptatiH)", "अशीतिः (ashiitiH)", "नवतिः (navatiH)", "शतम् (shatam)"
        ];

        let currentNumber = 0;
        let selectedNumbers = [];
        let isSanEnabled = true;

        const numberTable =
            document.getElementById("numberTable");

        const sanskritContainer =
            document.getElementById("sanskritContainer");

        const sanskritWordElement =
            document.getElementById("sanskritWord");

        const generateButton =
            document.getElementById("generateBtn");

        const resetButton =
            document.getElementById("resetBtn");

        const soundButton =
            document.getElementById("soundBtn");

        const completePopup =
            document.getElementById("completePopup");

        const closeCompleteButton =
            document.getElementById("closeComplete");

        const audioContainer =
            document.getElementById("audioFiles");

        function getDisplayNumber(number) {
            return displayNumbers[number - 1];
        }

        function getSanskritWord(number) {
            const index = displayNumbers.indexOf(number);

            return index === -1 ? "" : sanskritWords[index];
        }

        function createAudioFiles() {
            audioContainer.innerHTML = "";

            displayNumbers.forEach(number => {
                const audio = document.createElement("audio");
                audio.id = `audio-${number}`;
                audio.preload = "none";

                const source = document.createElement("source");
                source.src = `./res/${number}.mp3`;
                source.type = "audio/mpeg";

                audio.appendChild(source);
                audioContainer.appendChild(audio);
            });
        }

        function playAudio(number) {
            const audio = document.getElementById(
                `audio-${number}`
            );

            if (!audio) return;

            audio.currentTime = 0;

            audio.play().catch(error => {
                console.warn("Audio could not play:", error);
            });
        }

        function toggleSan() {
            isSanEnabled = !isSanEnabled;
            soundButton.textContent =
                isSanEnabled ? "🔈" : "🔇";
        }

        function createGrid() {
            numberTable.innerHTML = "";

            const totalCells = grid.rows * grid.columns;

            for (let index = 0; index < totalCells; index++) {
                const row = Math.floor(index / grid.columns);
                const column = index % grid.columns;

                const number = column * grid.rows + row;
                const freeCell = index === 0;

                const selected =
                    number >= 1 &&
                    number <= 28 &&
                    selectedNumbers.includes(number);

                const cell = document.createElement("div");
                cell.classList.add("cell");

                if (freeCell) {
                    cell.classList.add("free");
                } else if (selected) {
                    cell.classList.add("selected");
                }

                if (selected && !freeCell) {
                    const displayNumber =
                        getDisplayNumber(number);

                    cell.textContent = displayNumber;

                    cell.addEventListener("click", () => {
                        playAudio(displayNumber);
                    });
                }

                numberTable.appendChild(cell);
            }
        }

        function handleGenerate() {
            const remainingNumbers =
                Array.from({ length: 28 }, (_, i) => i + 1)
                    .filter(number =>
                        !selectedNumbers.includes(number)
                    );

            if (remainingNumbers.length === 0) {
                completePopup.hidden = false;
                return;
            }

            const randomIndex = Math.floor(
                Math.random() * remainingNumbers.length
            );

            const selectedNumber = remainingNumbers[randomIndex];

            selectedNumbers.push(selectedNumber);

            currentNumber = getDisplayNumber(selectedNumber);
            sanskritWordElement.textContent =
                getSanskritWord(currentNumber);

            sanskritContainer.hidden = false;

            createGrid();

            if (isSanEnabled) {
                playAudio(currentNumber);
            }

            if (selectedNumbers.length === 28) {
                completePopup.hidden = false;
                generateButton.disabled = true;

                requestAnimationFrame(() => {
                    completePopup.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });
                  })
                }
            }
        

        function handleRestart() {
            currentNumber = 0;
            selectedNumbers = [];
            sanskritWordElement.textContent = "";
            completePopup.hidden = true;
            generateButton.disabled = false;

            createGrid();
        }

        function instruction() {
            instructionsPopup.hidden = false;
        }

        function closeInstructions() {
            instructionsPopup.hidden = true;
        }

        function closeIsComplete() {
            completePopup.hidden = true;
        }

        generateButton.addEventListener(
            "click", handleGenerate
        );

        resetButton.addEventListener(
            "click", handleRestart
        );

        soundButton.addEventListener(
            "click", toggleSan
        );

        closeCompleteButton.addEventListener(
            "click", closeIsComplete
        );


        createAudioFiles();
        createGrid();

        if (window.lucide) {
            lucide.createIcons();
        }

    })();
    </script>
