<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Build Your Own Portrait</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link rel="stylesheet" type="text/css" href="style.css" />
	<link rel="stylesheet" href="../shared/game-theme.css" />
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
	   <script src="../cmpk-jul.json"></script>
	<script src="ExquisiteCorpse.js" type="text/javascript"></script>
	<script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
</head>

<body data-page="games" class="zatam-themed-game zatam-game-page">

    <!-- Shared Zat.am Navbar -->
    <div id="navbar-mount"></div>

	<main class="zatam-game-shell">
	<section class="zatam-game-header">
		<span class="zatam-game-eyebrow">Portrait Creator</span>
		<h1 class="zatam-game-title">Build Your Own Portrait</h1>
		<p class="zatam-game-subtitle">Mix portrait sections or spin for a random combination.</p>
	</section>
	<div id="container">
   <div id="left-column">
	<img id="random-button" src="img/giphy-wheel.png" onmouseover="this.src='img/giphy-wheel.gif'" onmouseout="this.src='img/giphy-wheel.png'" class="btn" alt="Random combination" />
	<p id="wrd" aria-live="polite"></p>
			<div id="left-nav">
				<div id="btn-top-next" class="btn"><img class="arrow-btn" src="img/btn-next_off.png" /></div>
				<div id="btn-top-prev" class="btn"><img class="arrow-btn" src="img/btn-prev_off.png" /></div>
				<div id="btn-mid-next" class="btn"><img class="arrow-btn" src="img/btn-next_off.png" /></div>
				<div id="btn-mid-prev" class="btn"><img class="arrow-btn" src="img/btn-prev_off.png" /></div>
				<div id="btn-bottom-next" class="btn"><img class="arrow-btn" src="img/btn-next_off.png" /></div>
				<div id="btn-bottom-prev" class="btn"><img class="arrow-btn" src="img/btn-prev_off.png" /></div>
			</div>
			<div id="section-edges">
				<div class="section-edge-line" aria-hidden="true"></div>
			</div>
		</div>
		<div id="presidents">
			<div id="top-sections">
				<div id="top-section-1" class="section top1">	
				</div>
				<div id="top-section-2" class="section top2">	
				</div>				
				<div id="top-section-3" class="section top3">	
				</div>				
				<div id="top-section-4" class="section top4">	
				</div>				
				<div id="top-section-5" class="section top5">	
				</div>
				<div id="top-section-6" class="section top6">	
				</div>
				<div id="top-section-7" class="section top7">	
				</div>				
				<div id="top-section-8" class="section top8">	
				</div>				
				<div id="top-section-9" class="section top9">	
				</div>
				<div id="top-section-10" class="section top10">	
				</div>
				<div id="top-section-11" class="section top11">	
				</div>
				<div id="top-section-12" class="section top12">	
				</div>
			</div>
			<div id="mid-sections">
				<div id="mid-section-1" class="section mid1">
				</div>				
				<div id="mid-section-2" class="section mid2">	
				</div>				
				<div id="mid-section-3" class="section mid3">	
				</div>				
				<div id="mid-section-4" class="section mid4">	
				</div>				
				<div id="mid-section-5" class="section mid5">	
				</div>
				<div id="mid-section-6" class="section mid6">	
				</div>
				<div id="mid-section-7" class="section mid7">	
				</div>				
				<div id="mid-section-8" class="section mid8">	
				</div>				
				<div id="mid-section-9" class="section mid9">	
				</div>
				<div id="mid-section-10" class="section mid10">	
				</div>
				<div id="mid-section-11" class="section mid11">	
				</div>
				<div id="mid-section-12" class="section mid12">	
				</div>
			</div>
			<div id="bottom-sections">
				<div id="bottom-section-1" class="section bottom1">
				</div>				
				<div id="bottom-section-2" class="section bottom2">

				<div id="bottom-section-3" class="section bottom3">

				<div id="bottom-section-4" class="section bottom4">

				<div id="bottom-section-5" class="section bottom5">

				<div id="bottom-section-7" class="section bottom7">	
				</div>				
				<div id="bottom-section-8" class="section bottom8">	
				</div>				
				<div id="bottom-section-9" class="section bottom9">	
				</div>
				<div id="bottom-section-10" class="section bottom10">	
				</div>
				<div id="bottom-section-11" class="section bottom11">	
				</div>
				<div id="bottom-section-12" class="section bottom12">	
				</div>
			</div>
		</div>	
	</div>
	<div id="pres-btns" aria-label="Choose a complete portrait">
		<button id="btn-1" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-2" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-3" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-4" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-5" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-6" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-7" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-8" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-9" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-10" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-11" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
		<button id="btn-12" class="zatam-game-btn zatam-game-btn-secondary pres-btn" type="button"></button>
	</div>
	<div id="footer">
		<div id="footer-links">
			<p>Inspired by Build Your Own President — https://www.idiotsbooks.com/buildyourownpresident/</p>
		</div>
	</div>
	</main>


    <!-- Shared Zat.am Navbar -->
    <script
      type="module"
      src="../js/navbar-loader.js"
    ></script>
</body>
</html>
