<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>राशयः</title>
    <link rel="stylesheet" href="../shared/game-theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body data-page="games" class="zatam-themed-game zatam-game-page">
    <div id="navbar-mount"></div>

    <main class="zatam-game-shell">
      <header class="zatam-game-header">
        <span class="zatam-game-eyebrow">Zodiac Wheel</span>
        <h1 class="zatam-game-title">राशयः</h1>
        <p class="zatam-game-subtitle">Spin the wheel to reveal a zodiac sign in Sanskrit.</p>
      </header>

      <section id="app" class="wheel-game" aria-label="Sanskrit zodiac wheel">
        <div class="game-layout zatam-game-play-area">
          <section class="wheel-panel" aria-label="Spin the zodiac wheel">
            <div class="wheel-stage">
              <img class="marker" src="marker.png" alt="Wheel pointer" />
              <img class="wheel" src="wheel.png" alt="Wheel showing twelve zodiac symbols" />
            </div>
            <div class="spin-actions zatam-game-actions">
              <button id="spin-button" class="spin-button zatam-game-btn zatam-game-btn-primary" type="button">Spin</button>
            </div>
            <p id="drawn-sign" class="drawn-sign zatam-game-status" aria-live="polite" lang="sa"></p>
          </section>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script type="module" src="../js/navbar-loader.js"></script>
  </body>
</html>
