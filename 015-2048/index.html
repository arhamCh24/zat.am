<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>२०४८ - 2048</title>

    <link rel="stylesheet" href="css/keyframes.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="./२०४८.ico">

    <script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
</head>

<body data-page="games">
    <div id="navbar-mount"></div>

    <script type="module" src="/auth/api/middleware.js"></script>

    <main class="game-2048">
        <header class="game-heading">
            <span class="game-eyebrow">शतम् · NUMBER CHALLENGE</span>
            <h1>२०४८</h1>
            <p>Slide, merge, and reach the २०४८ tile.</p>
        </header>

        <div class="game-toolbar">
            <div class="game-stat score-container">
                <span>Score</span>
                <strong class="score">०</strong>
                <div class="score-addition"></div>
            </div>

            <div class="game-stat best-container">
                <span>Personal Best</span>
                <strong class="score">०</strong>
            </div>

            <div class="game-stat">
                <span>Time Passed</span>
                <strong id="timerValue">00:00</strong>
            </div>

            <button type="button" class="restart-btn">
                New Game
            </button>
        </div>

        <p class="game-instructions">
            Use <b>arrow keys</b> or <b>swipe</b>.
            Merge matching tiles to reach <b>२०४८</b>.
        </p>

        <div class="game-container">
            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>

            <div class="tile-container"></div>

            <div class="failure-container pop-container">
                <p>Game Over</p>
                <span>No moves left. Select New Game to try again.</span>
            </div>

            <div class="winning-container pop-container">
                <p>उत्तमम्!</p>
                <span>You reached २०४८!</span>
            </div>
        </div>

        <footer class="footer">
            Based on
            <a href="https://github.com/gd4Ark/2048">gd4Ark/2048</a>
        </footer>
    </main>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/event.js"></script>
    <script src="js/view.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="../js/navbar-loader.js"></script>
</body>
</html>
