    <script>
        document.addEventListener("click", function (event) {

            const navbar = document.getElementById(
                "header-placeholder"
            );

            if (!navbar || !navbar.contains(event.target)) {
                return;
            }

            const clickedElement = event.target.closest(
                ".zatam-logo, [data-nav-page='contest'], #navbar-login-btn"
            );

            if (!clickedElement) {
                return;
            }

            let destination = null;

            // ==============================
            // Logo -> BP26 Competition
            // ==============================
            if (clickedElement.matches(".zatam-logo")) {
                destination = "https://zat.am/bp26/index.html";
            }

            // ==============================
            // Contest -> BP26 Competition
            // ==============================
            else if (
                clickedElement.matches("[data-nav-page='contest']")
            ) {

    else if (
    clickedElement.matches("#navbar-login-btn")
) {
    const isLocal =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

    const loginUrl = new URL(
        "/auth/login.html",
        "https://zat.am"
    );

    if (!isLocal) {
        loginUrl.searchParams.set(
            "redirect",
            "window.location.href"
        );
    }

    destination = loginUrl.href;
}

            // ==============================
            // Navigate
            // ==============================
            if (destination) {
                event.preventDefault();
                event.stopImmediatePropagation();

                window.location.assign(destination);
            }

        }, true);

function addLucideIcon(icon, group, x, y, size = 24, color = "#333333") {
    const svg = createElement(icon, {
        width: size,
        height: size,
        viewbox: "0 0 24 24",
        stroke: color,
        "stroke-width": 2
    });

    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("color", color);
    svg.setAttribute("stroke", color);
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

    const svgText = new XMLSerializer().serializeToString(svg);
    const url = "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svgText);

    const img = new Image();

    img.onload = () => {
        const bp = new createjs.Bitmap(img);
        bp.x = x;
        bp.y = y;

        group.addChild(bp);
        S.update();
    };

    img.onerror = () => {
        console.error("Lucide icon didn't load");
    };

    img.src = url;
}

                const txt = getHoverText(cell.wordValue);

                if (!txt) return;

                tooltipEl.textContent = txt;

// Working with mobile and laptop compatibility
function bp26OffsetZimCanvas() {
    const placeholder = document.getElementById("header-placeholder");
    const offset = placeholder ? placeholder.offsetHeight : 0;
    const moveHigher = 20;

    document.querySelectorAll("canvas").forEach((canvas) => {
        
        if(window.innerWidth <= 600){
           canvas.style.width = "calc(100vw - 16px)";
            canvas.style.height = "auto";
            canvas.style.maxWidth = "100%";
            // canvas.style.marginTop = offset + "px";
            canvas.style.marginTop = "-15px";
            canvas.style.marginLeft = "-10";
            canvas.style.marginRight = "0px"; 
        } else{
        canvas.style.marginTop = (offset - moveHigher) + "px";
        canvas.style.height = `calc(100vh - ${offset}px)`;
        }
    });
}

window.addEventListener("load", () => {
    bp26OffsetZimCanvas();

    let tries = 0;

    const i = setInterval(() => {
        bp26OffsetZimCanvas();
        tries += 1;

        if (tries > 20) clearInterval(i);
    }, 150);
});

window.addEventListener("resize", bp26OffsetZimCanvas);

// Set the game name to be used the database insert
window.addEventListener("DOMContentLoaded", () => {
    if (window.bp26Init) {
        window.bp26Init({
            game: "bp26-Game7",
            day: 7
        });
    }
});

// Submit score function
async function submitScoreNow(finalScore) {
    if (typeof window.reportScore !== "function") {
        console.warn(
            "[BP26] reportScore() not found. Check that ./js/bp26-score.js is loading."
        );
        return;
    }

    try {
        await window.reportScore(finalScore);
        console.log("[BP26] ✅ reportScore success");
    } catch (err) {
        console.error("[BP26] ❌ reportScore failed", err);
    }
}
