<!doctype html>
<html lang="sa">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Sanskrit Bhagavad Gita word-search game.">
    <title>अन्वेषणम् | Zat.am</title>
    <link rel="stylesheet" href="styles/game.css">
  </head>
  <body data-page="games">
    <!-- Shared Zat.am Navbar -->
    <div id="navbar-mount"></div>

    <main class="game-page">
      <header class="game-header">
        <p class="mangalam">॥ श्रीः ॥</p>
        <p id="timer" role="timer" aria-live="polite">३०</p>
        <h1>अन्वेषणम्</h1>
        <p id="lead">
          अस्मिन् अक्षरसमूहे श्रीमद्भगवद्गीतातः
          <span id="nPresent"></span> पदानि सन्ति। करोतु अन्वेषणम्।<br>
          <span id="lead2"></span>
        </p>
        <p id="statusMessage" aria-live="polite" hidden>
          <span id="nFound"></span> पदानि अन्वेषितानि
        </p>
        <p id="finishMessage" role="status" hidden>॥ शुभमस्तु ॥</p>
      </header>

      <div class="game-layout">
        <aside class="game-controls" aria-label="क्रीडा-विकल्पाः">
          <section class="control-group" aria-labelledby="verse-settings-heading">
            <h2 id="verse-settings-heading">श्लोक-विकल्पाः</h2>

            <label for="chapter-select">अध्यायः</label>
            <select id="chapter-select" name="chapter">
              <option value="">चिनोतु</option>
            </select>

            <label for="verse-select">श्लोकः</label>
            <select id="verse-select" name="verse" disabled>
              <option value="">चिनोतु</option>
            </select>

            <button id="load-verse" type="button" disabled>
              आरभताम्
            </button>
          </section>

          <section class="control-group" aria-labelledby="difficulty-heading">
            <h2 id="difficulty-heading">कठिनता</h2>
            <div class="difficulty-options" role="group" aria-label="कठिनता">
              <button class="difficulty-button" type="button" data-size="5">सरलम्</button>
              <button class="difficulty-button" type="button" data-size="7">मध्यमम्</button>
              <button class="difficulty-button" type="button" data-size="10">कठिनम्</button>
            </div>
          </section>
        </aside>

        <section class="game-board" aria-label="अक्षरसमूहः">
          <div id="gridParent">
            <div id="grid" role="grid" aria-label="पदान्वेषण-अक्षरसमूहः"></div>
          </div>
        </section>
      </div>

      <nav class="game-actions" aria-label="क्रीडा-क्रियाः">
        <button id="hint-button" type="button" aria-controls="hintPopup" aria-expanded="false">
          <img src="assets/images/hint.png" alt="">
          <span>पदानि कानि?</span>
        </button>
        <button id="refresh-button" type="button">
          <img src="assets/images/refresh.png" alt="">
          <span>पुनः</span>
        </button>
      </nav>

      <div id="hintPopup" class="hint-popup" role="dialog" aria-modal="true" aria-labelledby="hint-heading" hidden>
        <section class="content">
          <div class="hint-popup-header">
            <h2 id="hint-heading">अन्वेषणीयपदानि</h2>
            <button class="hint-close" type="button" data-close-hint aria-label="सूचनां पिधातु">×</button>
          </div>
          <ul id="answers"></ul>
        </section>
      </div>

      <footer class="game-footer">
        <a href="https://kpachar.github.io/vishnu/find.html" rel="noreferrer">Original word-search base</a>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
    <script src="data/bhagavad-gita.js"></script>
    <script type="module" src="scripts/game.js"></script>
    <script type="module" src="../js/navbar-loader.js"></script>
  </body>
</html>
